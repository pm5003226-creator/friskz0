<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friskz0 - Unlimited Access</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f1e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 80px;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-right: 1px solid #2a2a3e;
            overflow-y: auto;
        }

        .sidebar-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            margin: 15px 0;
            border-radius: 10px;
            transition: all 0.3s ease;
            color: #888;
        }

        .sidebar-icon:hover {
            background: #2a2a3e;
            color: #00d4ff;
            transform: scale(1.1);
        }

        .sidebar-icon.active {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: #fff;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Navigation Bar */
        .nav-bar {
            background: #16161f;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #2a2a3e;
        }

        .nav-bar input {
            flex: 1;
            background: #2a2a3e;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .nav-bar input::placeholder {
            color: #666;
        }

        .nav-bar input:focus {
            outline: none;
            border: 1px solid #00d4ff;
            background: #1f1f2e;
        }

        .nav-icons {
            display: flex;
            gap: 10px;
        }

        .nav-icon {
            width: 35px;
            height: 35px;
            background: #2a2a3e;
            border: none;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-icon:hover {
            background: #3a3a4e;
            color: #00d4ff;
        }

        /* Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: none;
        }

        .content.active {
            display: block;
        }

        /* Home Section */
        .home-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .home-title {
            font-size: 4em;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .home-subtitle {
            font-size: 1.1em;
            color: #aaa;
            margin-bottom: 50px;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            position: relative;
            margin-bottom: 50px;
        }

        .search-box input {
            width: 100%;
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            padding: 15px 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #00d4ff;
            background: #1f1f2e;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 50px;
        }

        .quick-btn {
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            padding: 15px;
            border-radius: 10px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .quick-btn:hover {
            background: #3a3a4e;
            color: #00d4ff;
            border-color: #00d4ff;
        }

        /* Games Section */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        .game-card {
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #2a2a3e;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: #00d4ff;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .game-card-image {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #1a1a2e, #2a2a3e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            overflow: hidden;
        }

        .game-card-title {
            padding: 15px;
            font-weight: 600;
            text-align: center;
            color: #fff;
        }

        /* Apps Section */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        .app-card {
            background: #2a2a3e;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #3a3a4e;
        }

        .app-card:hover {
            background: #3a3a4e;
            transform: scale(1.05);
            border-color: #00d4ff;
        }

        .app-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .app-name {
            font-weight: 600;
            color: #fff;
        }

        /* Browser Section */
        .browser-frame {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            background: #1a1a2e;
        }

        /* Settings Modal */
        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .settings-modal.active {
            display: flex;
        }

        .settings-content {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .settings-close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .settings-close:hover {
            color: #00d4ff;
        }

        .settings-item {
            margin: 20px 0;
            padding: 15px;
            background: #2a2a3e;
            border-radius: 10px;
        }

        .settings-item label {
            display: block;
            margin-bottom: 10px;
            color: #00d4ff;
            font-weight: 600;
        }

        .settings-item select,
        .settings-item input {
            width: 100%;
            background: #1f1f2e;
            border: 1px solid #3a3a4e;
            padding: 10px;
            border-radius: 8px;
            color: #fff;
        }

        .settings-item select:focus,
        .settings-item input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a4e;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00d4ff;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #fff;
        }

        .suggest-game {
            background: #2a2a3e;
            border: 1px dashed #00d4ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .suggest-game:hover {
            background: #3a3a4e;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-icon active" onclick="showSection('home')" title="Home">🏠</div>
            <div class="sidebar-icon" onclick="showSection('games')" title="Games">🎮</div>
            <div class="sidebar-icon" onclick="showSection('apps')" title="Apps">📱</div>
            <div class="sidebar-icon" onclick="showSection('browser')" title="Browser">🌐</div>
            <div class="sidebar-icon" onclick="showSection('shopping')" title="Shopping">🛍️</div>
            <div class="sidebar-icon" onclick="showSection('ai')" title="AI">🤖</div>
            <div class="sidebar-icon" onclick="openSettings()" title="Settings">⚙️</div>
        </div>

        <!-- Main Content -->
        <div class="main">
            <!-- Navigation Bar -->
            <div class="nav-bar">
                <input type="text" id="urlInput" placeholder="Search or type a URL" onkeypress="handleSearch(event)">
                <div class="nav-icons">
                    <button class="nav-icon" onclick="searchUrl()">🔍</button>
                    <button class="nav-icon" onclick="toggleFullscreen()">⛶</button>
                    <button class="nav-icon" onclick="openSettings()">⚙️</button>
                </div>
            </div>

            <!-- Home Section -->
            <div class="content active" id="home">
                <div class="home-section">
                    <h1 class="home-title">Friskz0</h1>
                    <p class="home-subtitle">Fast • Sleek • Unlimited Access</p>
                    <div class="search-box">
                        <input type="text" id="homeSearch" placeholder="Search or type a URL" onkeypress="handleHomeSearch(event)">
                    </div>
                    <div class="quick-buttons">
                        <button class="quick-btn" onclick="quickAccess('https://www.wikipedia.org')">Wikipedia</button>
                        <button class="quick-btn" onclick="quickAccess('https://www.youtube.com')">YouTube</button>
                        <button class="quick-btn" onclick="quickAccess('https://chatgpt.com')">AI</button>
                        <button class="quick-btn" onclick="showSection('games')">Games</button>
                    </div>
                </div>
            </div>

            <!-- Games Section -->
            <div class="content" id="games">
                <h2 class="section-title">🎮 Games Library</h2>
                <div class="suggest-game" onclick="alert('Suggest your favorite game!')">
                    💡 Suggest a new game
                </div>
                <div class="games-grid" id="gamesGrid">
                    <!-- Games will be populated here -->
                </div>
            </div>

            <!-- Apps Section -->
            <div class="content" id="apps">
                <h2 class="section-title">📱 Apps & Tools</h2>
                <div class="apps-grid" id="appsGrid">
                    <!-- Apps will be populated here -->
                </div>
            </div>

            <!-- Browser Section -->
            <div class="content" id="browser">
                <h2 class="section-title">🌐 Web Browser</h2>
                <p style="margin-bottom: 20px; color: #aaa;">Enter a URL above to browse</p>
                <iframe id="browserFrame" class="browser-frame"></iframe>
            </div>

            <!-- Shopping Section -->
            <div class="content" id="shopping">
                <h2 class="section-title">🛍️ Shopping</h2>
                <div class="apps-grid" id="shoppingGrid">
                    <!-- Shopping will be populated here -->
                </div>
            </div>

            <!-- AI Section -->
            <div class="content" id="ai">
                <h2 class="section-title">🤖 AI Tools</h2>
                <div class="apps-grid" id="aiGrid">
                    <!-- AI tools will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <span class="settings-close" onclick="closeSettings()">&times;</span>
            <h2 style="margin-bottom: 20px;">⚙️ Settings</h2>
            
            <div class="settings-item">
                <label>Proxy Method</label>
                <select id="proxyMethod">
                    <option value="cors">CORS Proxy</option>
                    <option value="ultraviolet">Ultraviolet</option>
                    <option value="direct">Direct Access</option>
                </select>
            </div>

            <div class="settings-item">
                <label>Theme</label>
                <select id="theme">
                    <option value="dark">Dark (Default)</option>
                    <option value="light">Light</option>
                    <option value="auto">Auto</option>
                </select>
            </div>

            <div class="settings-item">
                <label>Notification Sound</label>
                <select>
                    <option value="on">On</option>
                    <option value="off">Off</option>
                </select>
            </div>

            <div class="settings-item">
                <label>Search Engine</label>
                <select>
                    <option value="google">Google</option>
                    <option value="bing">Bing</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                </select>
            </div>

            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #3a3a4e;">
                <small style="color: #666;">DMCA • Terms of Service</small>
            </div>
        </div>
    </div>

    <script>
        // Games Data
        const games = [
            { name: 'Bowmasters', emoji: '🏹', url: 'https://www.friv.com' },
            { name: 'OvO', emoji: '⭕', url: 'https://www.kongregate.com' },
            { name: 'OvO 2', emoji: '⭕', url: 'https://www.kongregate.com' },
            { name: 'OvO 3 Dimensions', emoji: '🔷', url: 'https://www.kongregate.com' },
            { name: 'Gladihoppers', emoji: '⚔️', url: 'https://www.miniclip.com' },
            { name: 'Ice Dodo', emoji: '❄️', url: 'https://www.miniclip.com' },
            { name: 'Block Blast', emoji: '🧱', url: 'https://www.addictinggames.com' },
            { name: 'Jetpack Joyride', emoji: '🚀', url: 'https://www.kongregate.com' },
            { name: 'Friday Night Funkin', emoji: '🎤', url: 'https://www.kongregate.com' },
            { name: 'Sprunki', emoji: '🎵', url: 'https://www.kongregate.com' },
            { name: 'Temple Run 2', emoji: '🏃', url: 'https://www.miniclip.com' },
            { name: 'Stickman Hook', emoji: '🪝', url: 'https://www.kongregate.com' },
        ];

        // Apps Data
        const apps = [
            { name: 'Gmail', emoji: '📧', url: 'https://mail.google.com' },
            { name: 'Google Drive', emoji: '☁️', url: 'https://drive.google.com' },
            { name: 'Figma', emoji: '🎨', url: 'https://figma.com' },
            { name: 'Notion', emoji: '📝', url: 'https://notion.so' },
            { name: 'Canva', emoji: '🖌️', url: 'https://canva.com' },
            { name: 'GitHub', emoji: '💻', url: 'https://github.com' },
        ];

        // Shopping Data
        const shopping = [
            { name: 'Amazon', emoji: '📦', url: 'https://amazon.com' },
            { name: 'eBay', emoji: '🛒', url: 'https://ebay.com' },
            { name: 'Aliexpress', emoji: '🌏', url: 'https://aliexpress.com' },
        ];

        // AI Data
        const aiTools = [
            { name: 'ChatGPT', emoji: '🤖', url: 'https://chatgpt.com' },
            { name: 'Claude', emoji: '🧠', url: 'https://claude.ai' },
            { name: 'Gemini', emoji: '✨', url: 'https://gemini.google.com' },
            { name: 'Copilot', emoji: '🪶', url: 'https://copilot.microsoft.com' },
        ];

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadGames();
            loadApps();
            loadShopping();
            loadAI();
        });

        function loadGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = games.map(game => `
                <div class="game-card" onclick="quickAccess('${game.url}')">
                    <div class="game-card-image">${game.emoji}</div>
                    <div class="game-card-title">${game.name}</div>
                </div>
            `).join('');
        }

        function loadApps() {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = apps.map(app => `
                <div class="app-card" onclick="quickAccess('${app.url}')">
                    <div class="app-icon">${app.emoji}</div>
                    <div class="app-name">${app.name}</div>
                </div>
            `).join('');
        }

        function loadShopping() {
            const grid = document.getElementById('shoppingGrid');
            grid.innerHTML = shopping.map(item => `
                <div class="app-card" onclick="quickAccess('${item.url}')">
                    <div class="app-icon">${item.emoji}</div>
                    <div class="app-name">${item.name}</div>
                </div>
            `).join('');
        }

        function loadAI() {
            const grid = document.getElementById('aiGrid');
            grid.innerHTML = aiTools.map(tool => `
                <div class="app-card" onclick="quickAccess('${tool.url}')">
                    <div class="app-icon">${tool.emoji}</div>
                    <div class="app-name">${tool.name}</div>
                </div>
            `).join('');
        }

        function showSection(sectionId) {
            // Hide all
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar-icon').forEach(el => el.classList.remove('active'));

            // Show selected
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        function quickAccess(url) {
            window.open(url, '_blank');
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                searchUrl();
            }
        }

        function handleHomeSearch(event) {
            if (event.key === 'Enter') {
                let url = document.getElementById('homeSearch').value;
                if (!url.startsWith('http')) url = 'https://' + url;
                quickAccess(url);
            }
        }

        function searchUrl() {
            let url = document.getElementById('urlInput').value;
            if (!url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            quickAccess(url);
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Close settings when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('settingsModal');
            if (event.target == modal) {
                modal.classList.remove('active');
            }
        }
    </script>
</body>
</html>
