<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friskz0 - Unlimited Access</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f1e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 80px;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-right: 1px solid #2a2a3e;
            overflow-y: auto;
        }

        .sidebar-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            margin: 15px 0;
            border-radius: 10px;
            transition: all 0.3s ease;
            color: #888;
        }

        .sidebar-icon:hover {
            background: #2a2a3e;
            color: #00d4ff;
            transform: scale(1.1);
        }

        .sidebar-icon.active {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: #fff;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Navigation Bar */
        .nav-bar {
            background: #16161f;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #2a2a3e;
        }

        .nav-bar input {
            flex: 1;
            background: #2a2a3e;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .nav-bar input::placeholder {
            color: #666;
        }

        .nav-bar input:focus {
            outline: none;
            border: 1px solid #00d4ff;
            background: #1f1f2e;
        }

        .nav-icons {
            display: flex;
            gap: 10px;
        }

        .nav-icon {
            width: 35px;
            height: 35px;
            background: #2a2a3e;
            border: none;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-icon:hover {
            background: #3a3a4e;
            color: #00d4ff;
        }

        /* Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: none;
        }

        .content.active {
            display: block;
        }

        /* Home Section */
        .home-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .home-title {
            font-size: 4em;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .home-subtitle {
            font-size: 1.1em;
            color: #aaa;
            margin-bottom: 50px;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            position: relative;
            margin-bottom: 50px;
        }

        .search-box input {
            width: 100%;
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            padding: 15px 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #00d4ff;
            background: #1f1f2e;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 50px;
        }

        .quick-btn {
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            padding: 15px;
            border-radius: 10px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .quick-btn:hover {
            background: #3a3a4e;
            color: #00d4ff;
            border-color: #00d4ff;
        }

        /* Games Section */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        .game-card {
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #2a2a3e;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: #00d4ff;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .game-card-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #1a1a2e, #2a2a3e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            overflow: hidden;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .game-card-image canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .game-card-title {
            padding: 15px;
            font-weight: 600;
            text-align: center;
            color: #fff;
            background: #1a1a2e;
        }

        /* Apps Section */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        .app-card {
            background: #2a2a3e;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #3a3a4e;
        }

        .app-card:hover {
            background: #3a3a4e;
            transform: scale(1.05);
            border-color: #00d4ff;
        }

        .app-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .app-name {
            font-weight: 600;
            color: #fff;
        }

        /* Game Modal */
        .game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-modal.active {
            display: flex;
        }

        .game-modal-content {
            background: #1a1a2e;
            border-radius: 15px;
            width: 100%;
            max-width: 1000px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.3);
        }

        .game-modal-header {
            background: #2a2a3e;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3a3a4e;
        }

        .game-modal-title {
            font-size: 1.5em;
            color: #00d4ff;
        }

        .game-modal-close {
            font-size: 28px;
            color: #888;
            cursor: pointer;
            transition: all 0.3s ease;
            background: none;
            border: none;
        }

        .game-modal-close:hover {
            color: #00d4ff;
        }

        .game-modal-body {
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f1e;
        }

        #gameCanvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }

        /* Settings Modal */
        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .settings-modal.active {
            display: flex;
        }

        .settings-content {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .settings-close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            transition: all 0.3s ease;
            background: none;
            border: none;
        }

        .settings-close:hover {
            color: #00d4ff;
        }

        .settings-item {
            margin: 20px 0;
            padding: 15px;
            background: #2a2a3e;
            border-radius: 10px;
        }

        .settings-item label {
            display: block;
            margin-bottom: 10px;
            color: #00d4ff;
            font-weight: 600;
        }

        .settings-item select,
        .settings-item input {
            width: 100%;
            background: #1f1f2e;
            border: 1px solid #3a3a4e;
            padding: 10px;
            border-radius: 8px;
            color: #fff;
        }

        .settings-item select:focus,
        .settings-item input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a4e;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00d4ff;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #fff;
        }

        .game-info {
            background: #2a2a3e;
            border: 1px dashed #00d4ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #aaa;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-icon active" onclick="showSection('home')" title="Home">🏠</div>
            <div class="sidebar-icon" onclick="showSection('games')" title="Games">🎮</div>
            <div class="sidebar-icon" onclick="showSection('apps')" title="Apps">📱</div>
            <div class="sidebar-icon" onclick="showSection('shopping')" title="Shopping">🛍️</div>
            <div class="sidebar-icon" onclick="showSection('ai')" title="AI">🤖</div>
            <div class="sidebar-icon" onclick="openSettings()" title="Settings">⚙️</div>
        </div>

        <!-- Main Content -->
        <div class="main">

                <input type="text" id="urlInput" placeholder="Search or type a URL" onkeypress="handleSearch(event)">

                </div>
            </div>

            <!-- Home Section -->
            <div class="content active" id="home">
                <div class="home-section">

                    <div class="search-box">
                        <input type="text" id="homeSearch" placeholder="Search or type a URL" onkeypress="handleHomeSearch(event)">
                    </div>
                    <div class="quick-buttons">
                        <button class="quick-btn" onclick="quickAccess('https://www.wikipedia.org')">Wikipedia</button>
                        <button class="quick-btn" onclick="quickAccess('https://www.youtube.com')">YouTube</button>
                        <button class="quick-btn" onclick="quickAccess('https://chatgpt.com')">AI</button>

                    💡 Click any game to play it! All games are built-in and run directly in Friskz0.

    <!-- Game Modal -->
    <div class="game-modal" id="gameModal">
        <div class="game-modal-content">

            <div class="settings-item">

            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #3a3a4e;">

    <script>
        // Game Objects
        let currentGame = null;
        let gameRunning = false;
        let gameCanvas = null;
        let gameCtx = null;

        // FLAPPY BIRD GAME
        class FlappyBird {
            constructor(canvas, ctx) {
                this.canvas = canvas;
                this.ctx = ctx;
                this.bird = { x: 50, y: 100, width: 20, height: 20, velocity: 0 };
                this.pipes = [];
                this.score = 0;
                this.gameOver = false;
                this.gravity = 0.6;
                this.jumpPower = -12;
                this.pipeGap = 120;
                this.pipeWidth = 60;
                this.pipeSpacing = 200;
                
                canvas.addEventListener('click', () => this.jump());
                canvas.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.jump();
                    }
                });
            }

            jump() {
                if (!this.gameOver) {
                    this.bird.velocity = this.jumpPower;
                }
            }

            update() {
                if (this.gameOver) return;

                this.bird.velocity += this.gravity;
                this.bird.y += this.bird.velocity;

                if (this.bird.y + this.bird.height > this.canvas.height || this.bird.y < 0) {
                    this.gameOver = true;
                }

                if (this.pipes.length === 0 || this.pipes[this.pipes.length - 1].x < this.canvas.width - this.pipeSpacing) {
                    const gapY = Math.random() * (this.canvas.height - this.pipeGap - 100) + 50;
                    this.pipes.push({ x: this.canvas.width, gapY: gapY });
                }

                for (let i = this.pipes.length - 1; i >= 0; i--) {
                    this.pipes[i].x -= 5;

                    if (this.pipes[i].x + this.pipeWidth < this.bird.x && !this.pipes[i].scored) {
                        this.pipes[i].scored = true;
                        this.score++;
                    }

                    if (this.pipes[i].x < -this.pipeWidth) {
                        this.pipes.splice(i, 1);
                        continue;
                    }

                    if (this.checkCollision(this.pipes[i])) {
                        this.gameOver = true;
                    }
                }
            }

            checkCollision(pipe) {
                return this.bird.x < pipe.x + this.pipeWidth &&
                       this.bird.x + this.bird.width > pipe.x &&
                       (this.bird.y < pipe.gapY || this.bird.y + this.bird.height > pipe.gapY + this.pipeGap);
            }

            draw() {
                this.ctx.fillStyle = '#87CEEB';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#FFD700';
                this.ctx.fillRect(this.bird.x, this.bird.y, this.bird.width, this.bird.height);

                this.ctx.fillStyle = '#228B22';
                for (let pipe of this.pipes) {
                    this.ctx.fillRect(pipe.x, 0, this.pipeWidth, pipe.gapY);
                    this.ctx.fillRect(pipe.x, pipe.gapY + this.pipeGap, this.pipeWidth, this.canvas.height - pipe.gapY - this.pipeGap);
                }

                this.ctx.fillStyle = '#FFFFFF';
                this.ctx.font = 'bold 24px Arial';
                this.ctx.fillText('Score: ' + this.score, 10, 30);
                if (this.gameOver) {
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.fillStyle = '#FFFFFF';
                    this.ctx.font = 'bold 40px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('GAME OVER', this.canvas.width / 2, this.canvas.height / 2);
                    this.ctx.font = 'bold 20px Arial';
                    this.ctx.fillText('Score: ' + this.score, this.canvas.width / 2, this.canvas.height / 2 + 40);
                }
            }

            loop() {
                this.update();
                this.draw();
                if (gameRunning) requestAnimationFrame(() => this.loop());
            }
        }

        // SNAKE GAME
        class SnakeGame {
            constructor(canvas, ctx) {
                this.canvas = canvas;
                this.ctx = ctx;
                this.gridSize = 20;
                this.snake = [{ x: 10, y: 10 }];
                this.food = { x: 15, y: 15 };
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };
                this.score = 0;
                this.gameOver = false;

                document.addEventListener('keydown', (e) => this.handleKeyPress(e));
            }

            handleKeyPress(e) {
                if (e.key === 'ArrowUp' && this.direction.y === 0) this.nextDirection = { x: 0, y: -1 };
                if (e.key === 'ArrowDown' && this.direction.y === 0) this.nextDirection = { x: 0, y: 1 };
                if (e.key === 'ArrowLeft' && this.direction.x === 0) this.nextDirection = { x: -1, y: 0 };
                if (e.key === 'ArrowRight' && this.direction.x === 0) this.nextDirection = { x: 1, y: 0 };
            }

            update() {
                if (this.gameOver) return;

                this.direction = this.nextDirection;
                const head = { x: this.snake[0].x + this.direction.x, y: this.snake[0].y + this.direction.y };

                if (head.x < 0 || head.x >= this.canvas.width / this.gridSize ||
                    head.y < 0 || head.y >= this.canvas.height / this.gridSize) {
                    this.gameOver = true;
                    return;
                }

                for (let segment of this.snake) {
                    if (head.x === segment.x && head.y === segment.y) {
                        this.gameOver = true;
                        return;
                    }
                }

                this.snake.unshift(head);

                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    this.food = {
                        x: Math.floor(Math.random() * (this.canvas.width / this.gridSize)),
                        y: Math.floor(Math.random() * (this.canvas.height / this.gridSize))
                    };
                } else {
                    this.snake.pop();
                }
            }

            draw() {
                this.ctx.fillStyle = '#000000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#00FF00';
                for (let segment of this.snake) {
                    this.ctx.fillRect(segment.x * this.gridSize, segment.y * this.gridSize, this.gridSize - 2, this.gridSize - 2);
                }

                this.ctx.fillStyle = '#FF0000';
                this.ctx.fillRect(this.food.x * this.gridSize, this.food.y * this.gridSize, this.gridSize - 2, this.gridSize - 2);

                this.ctx.fillStyle = '#FFFFFF';
                this.ctx.font = 'bold 20px Arial';
                this.ctx.fillText('Score: ' + this.score, 10, 30);

                if (this.gameOver) {
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.fillStyle = '#FFFFFF';
                    this.ctx.font = 'bold 40px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('GAME OVER', this.canvas.width / 2, this.canvas.height / 2);
                }
            }

            loop() {
                this.update();
                this.draw();
                if (gameRunning) setTimeout(() => this.loop(), 100);
            }
        }

        // PONG GAME
        class PongGame {
            constructor(canvas, ctx) {
                this.canvas = canvas;
                this.ctx = ctx;
                this.paddleHeight = 80;
                this.paddleWidth = 10;
                this.ballSize = 8;
                this.player1 = { x: 10, y: this.canvas.height / 2 - this.paddleHeight / 2, score: 0 };
                this.player2 = { x: this.canvas.width - 20, y: this.canvas.height / 2 - this.paddleHeight / 2, score: 0 };
                this.ball = { x: this.canvas.width / 2, y: this.canvas.height / 2, vx: 5, vy: 5 };
                this.gameOver = false;

                document.addEventListener('keydown', (e) => this.handleKeyPress(e));
            }

            handleKeyPress(e) {
                if (e.key === 'w') this.player1.y -= 20;
                if (e.key === 's') this.player1.y += 20;
                if (e.key === 'ArrowUp') this.player2.y -= 20;
                if (e.key === 'ArrowDown') this.player2.y += 20;
            }

            update() {
                if (this.gameOver) return;

                this.ball.x += this.ball.vx;
                this.ball.y += this.ball.vy;

                if (this.ball.y - this.ballSize < 0 || this.ball.y + this.ballSize > this.canvas.height) {
                    this.ball.vy = -this.ball.vy;
                }

                if (this.ball.x - this.ballSize < this.player1.x + this.paddleWidth &&
                    this.ball.y > this.player1.y && this.ball.y < this.player1.y + this.paddleHeight) {
                    this.ball.vx = -this.ball.vx;
                }

                if (this.ball.x + this.ballSize > this.player2.x &&
                    this.ball.y > this.player2.y && this.ball.y < this.player2.y + this.paddleHeight) {
                    this.ball.vx = -this.ball.vx;
                }

                if (this.ball.x < 0) {
                    this.player2.score++;
                    this.ball = { x: this.canvas.width / 2, y: this.canvas.height / 2, vx: 5, vy: 5 };
                }
                if (this.ball.x > this.canvas.width) {
                    this.player1.score++;
                    this.ball = { x: this.canvas.width / 2, y: this.canvas.height / 2, vx: -5, vy: 5 };
                }
            }

            draw() {
                this.ctx.fillStyle = '#000000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#FFFFFF';
                this.ctx.fillRect(this.player1.x, this.player1.y, this.paddleWidth, this.paddleHeight);
                this.ctx.fillRect(this.player2.x, this.player2.y, this.paddleWidth, this.paddleHeight);
                this.ctx.beginPath();
                this.ctx.arc(this.ball.x, this.ball.y, this.ballSize, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.font = 'bold 24px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText(this.player1.score + ' : ' + this.player2.score, this.canvas.width / 2, 30);
                this.ctx.textAlign = 'left';
            }

            loop() {
                this.update();
                this.draw();
                if (gameRunning) requestAnimationFrame(() => this.loop());
            }
        }

        // Games Data
        const games = [
            { 
                name: 'Flappy Bird', 
                class: FlappyBird,
                description: 'Click to flap! Avoid the pipes.',
                thumbnail: '🐦'
            },
            { 
                name: 'Snake', 
                class: SnakeGame,
                description: 'Arrow keys to move. Eat the food!',
                thumbnail: '🐍'
            },
            { 
                name: 'Pong', 
                class: PongGame,
                description: 'W/S or Arrow keys. Don\'t miss the ball!',
                thumbnail: '🎾'
            }
        ];

        // Apps Data
        const apps = [
            { name: 'Gmail', emoji: '📧', url: 'https://mail.google.com' },
            { name: 'Google Drive', emoji: '☁️', url: 'https://drive.google.com' },
            { name: 'Figma', emoji: '🎨', url: 'https://figma.com' },
            { name: 'Notion', emoji: '📝', url: 'https://notion.so' },
            { name: 'Canva', emoji: '🖌️', url: 'https://canva.com' },
            { name: 'GitHub', emoji: '💻', url: 'https://github.com' },
        ];

        // Shopping Data
        const shopping = [
            { name: 'Amazon', emoji: '📦', url: 'https://amazon.com' },
            { name: 'eBay', emoji: '🛒', url: 'https://ebay.com' },
            { name: 'Aliexpress', emoji: '🌏', url: 'https://aliexpress.com' },
        ];

        // AI Data
        const aiTools = [
            { name: 'ChatGPT', emoji: '🤖', url: 'https://chatgpt.com' },
            { name: 'Claude', emoji: '🧠', url: 'https://claude.ai' },
            { name: 'Gemini', emoji: '✨', url: 'https://gemini.google.com' },
            { name: 'Copilot', emoji: '🪶', url: 'https://copilot.microsoft.com' },
        ];

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadGames();
            loadApps();
            loadShopping();
            loadAI();
        });

        function loadGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = games.map((game, index) => `
                <div class="game-card" onclick="playGame(${index})">
                    <div class="game-card-image">
                        <div style="font-size: 60px;">${game.thumbnail}</div>
                    </div>
                    <div class="game-card-title">${game.name}</div>
                </div>
            `).join('');
        }

        function loadApps() {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = apps.map(app => `
                <div class="app-card" onclick="quickAccess('${app.url}')">
                    <div class="app-icon">${app.emoji}</div>
                    <div class="app-name">${app.name}</div>
                </div>
            `).join('');
        }

        function loadShopping() {
            const grid = document.getElementById('shoppingGrid');
            grid.innerHTML = shopping.map(item => `
                <div class="app-card" onclick="quickAccess('${item.url}')">
                    <div class="app-icon">${item.emoji}</div>
                    <div class="app-name">${item.name}</div>
                </div>
            `).join('');
        }

        function loadAI() {
            const grid = document.getElementById('aiGrid');
            grid.innerHTML = aiTools.map(tool => `
                <div class="app-card" onclick="quickAccess('${tool.url}')">
                    <div class="app-icon">${tool.emoji}</div>
                    <div class="app-name">${tool.name}</div>
                </div>
            `).join('');
        }

        function playGame(index) {
            const game = games[index];
            document.getElementById('gameModalTitle').textContent = game.name;
            document.getElementById('gameModal').classList.add('active');
            
            gameCanvas = document.getElementById('gameCanvas');
            gameCanvas.width = 800;
            gameCanvas.height = 600;
            gameCtx = gameCanvas.getContext('2d');
            
            gameRunning = true;
            currentGame = new game.class(gameCanvas, gameCtx);
            currentGame.loop();
        }

        function closeGameModal() {
            document.getElementById('gameModal').classList.remove('active');
            gameRunning = false;
            currentGame = null;
            document.removeEventListener('keydown', null);
        }

        function showSection(sectionId) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar-icon').forEach(el => el.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        function quickAccess(url) {
            window.open(url, '_blank');
        }

        function handleSearch(event) {
            if (event.key === 'Enter') searchUrl();
        }

        function handleHomeSearch(event) {
            if (event.key === 'Enter') {
                let url = document.getElementById('homeSearch').value;
                if (!url.startsWith('http')) url = 'https://' + url;
                quickAccess(url);
            }
        }

        function searchUrl() {
            let url = document.getElementById('urlInput').value;
            if (!url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            quickAccess(url);
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }

        window.onclick = function(event) {
            const gameModal = document.getElementById('gameModal');
            const settingsModal = document.getElementById('settingsModal');
            
            if (event.target == gameModal) closeGameModal();
            if (event.target == settingsModal) closeSettings();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeGameModal();
                closeSettings();
            }
        });
    </script>
</body>
</html>
