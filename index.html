<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friskz0 - Unlimited Access</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f1e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 80px;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-right: 1px solid #2a2a3e;
            overflow-y: auto;
        }

        .sidebar-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            margin: 15px 0;
            border-radius: 10px;
            transition: all 0.3s ease;
            color: #888;
        }

        .sidebar-icon:hover {
            background: #2a2a3e;
            color: #00d4ff;
            transform: scale(1.1);
        }

        .sidebar-icon.active {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: #fff;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Navigation Bar */
        .nav-bar {
            background: #16161f;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #2a2a3e;
        }

        .nav-bar input {
            flex: 1;
            background: #2a2a3e;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .nav-bar input::placeholder {
            color: #666;
        }

        .nav-bar input:focus {
            outline: none;
            border: 1px solid #00d4ff;
            background: #1f1f2e;
        }

        .nav-icons {
            display: flex;
            gap: 10px;
        }

        .nav-icon {
            width: 35px;
            height: 35px;
            background: #2a2a3e;
            border: none;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-icon:hover {
            background: #3a3a4e;
            color: #00d4ff;
        }

        /* Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: none;
        }

        .content.active {
            display: block;
        }

        /* Home Section */
        .home-section {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .home-title {
            font-size: 4em;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .home-subtitle {
            font-size: 1.1em;
            color: #aaa;
            margin-bottom: 50px;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            position: relative;
            margin-bottom: 50px;
        }

        .search-box input {
            width: 100%;
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            padding: 15px 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #00d4ff;
            background: #1f1f2e;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 50px;
        }

        .quick-btn {
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            padding: 15px;
            border-radius: 10px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .quick-btn:hover {
            background: #3a3a4e;
            color: #00d4ff;
            border-color: #00d4ff;
        }

        /* Games Section */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        .game-card {
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #2a2a3e;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: #00d4ff;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .game-card-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #1a1a2e, #2a2a3e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            overflow: hidden;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .game-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .game-card-title {
            padding: 15px;
            font-weight: 600;
            text-align: center;
            color: #fff;
            background: #1a1a2e;
        }

        /* Apps Section */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            padding-bottom: 40px;
        }

        .app-card {
            background: #2a2a3e;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #3a3a4e;
        }

        .app-card:hover {
            background: #3a3a4e;
            transform: scale(1.05);
            border-color: #00d4ff;
        }

        .app-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .app-name {
            font-weight: 600;
            color: #fff;
        }

        /* Game Modal */
        .game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-modal.active {
            display: flex;
        }

        .game-modal-content {
            background: #1a1a2e;
            border-radius: 15px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .game-modal-header {
            background: #2a2a3e;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3a3a4e;
        }

        .game-modal-title {
            font-size: 1.5em;
            color: #00d4ff;
        }

        .game-modal-close {
            font-size: 28px;
            color: #888;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .game-modal-close:hover {
            color: #00d4ff;
        }

        .game-modal-body {
            flex: 1;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Settings Modal */
        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .settings-modal.active {
            display: flex;
        }

        .settings-content {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .settings-close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .settings-close:hover {
            color: #00d4ff;
        }

        .settings-item {
            margin: 20px 0;
            padding: 15px;
            background: #2a2a3e;
            border-radius: 10px;
        }

        .settings-item label {
            display: block;
            margin-bottom: 10px;
            color: #00d4ff;
            font-weight: 600;
        }

        .settings-item select,
        .settings-item input {
            width: 100%;
            background: #1f1f2e;
            border: 1px solid #3a3a4e;
            padding: 10px;
            border-radius: 8px;
            color: #fff;
        }

        .settings-item select:focus,
        .settings-item input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a4e;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00d4ff;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #fff;
        }

        .suggest-game {
            background: #2a2a3e;
            border: 1px dashed #00d4ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .suggest-game:hover {
            background: #3a3a4e;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }

        .loader {
            border: 4px solid #3a3a4e;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-icon active" onclick="showSection('home')" title="Home">🏠</div>
            <div class="sidebar-icon" onclick="showSection('games')" title="Games">🎮</div>
            <div class="sidebar-icon" onclick="showSection('apps')" title="Apps">📱</div>
            <div class="sidebar-icon" onclick="showSection('shopping')" title="Shopping">🛍️</div>
            <div class="sidebar-icon" onclick="showSection('ai')" title="AI">🤖</div>
            <div class="sidebar-icon" onclick="openSettings()" title="Settings">⚙️</div>
        </div>

        <!-- Main Content -->
        <div class="main">
            <!-- Navigation Bar -->
            <div class="nav-bar">
                <input type="text" id="urlInput" placeholder="Search or type a URL" onkeypress="handleSearch(event)">
                <div class="nav-icons">
                    <button class="nav-icon" onclick="searchUrl()">🔍</button>
                    <button class="nav-icon" onclick="toggleFullscreen()">⛶</button>
                    <button class="nav-icon" onclick="openSettings()">⚙️</button>
                </div>
            </div>

            <!-- Home Section -->
            <div class="content active" id="home">
                <div class="home-section">
                    <h1 class="home-title">Friskz0</h1>
                    <p class="home-subtitle">Fast • Sleek • Unlimited Access</p>
                    <div class="search-box">
                        <input type="text" id="homeSearch" placeholder="Search or type a URL" onkeypress="handleHomeSearch(event)">
                    </div>
                    <div class="quick-buttons">
                        <button class="quick-btn" onclick="quickAccess('https://www.wikipedia.org')">Wikipedia</button>
                        <button class="quick-btn" onclick="quickAccess('https://www.youtube.com')">YouTube</button>
                        <button class="quick-btn" onclick="quickAccess('https://chatgpt.com')">AI</button>
                        <button class="quick-btn" onclick="showSection('games')">Games</button>
                    </div>
                </div>
            </div>

            <!-- Games Section -->
            <div class="content" id="games">
                <h2 class="section-title">🎮 Games Library - Click to Play!</h2>
                <div class="games-grid" id="gamesGrid">
                    <!-- Games will be populated here -->
                </div>
            </div>

            <!-- Apps Section -->
            <div class="content" id="apps">
                <h2 class="section-title">📱 Apps & Tools</h2>
                <div class="apps-grid" id="appsGrid">
                    <!-- Apps will be populated here -->
                </div>
            </div>

            <!-- Shopping Section -->
            <div class="content" id="shopping">
                <h2 class="section-title">🛍️ Shopping</h2>
                <div class="apps-grid" id="shoppingGrid">
                    <!-- Shopping will be populated here -->
                </div>
            </div>

            <!-- AI Section -->
            <div class="content" id="ai">
                <h2 class="section-title">🤖 AI Tools</h2>
                <div class="apps-grid" id="aiGrid">
                    <!-- AI tools will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Game Modal -->
    <div class="game-modal" id="gameModal">
        <div class="game-modal-content">
            <div class="game-modal-header">
                <h2 class="game-modal-title" id="gameModalTitle">Game</h2>
                <span class="game-modal-close" onclick="closeGameModal()">&times;</span>
            </div>
            <div class="game-modal-body">
                <div class="loading" id="loadingMsg">
                    <div class="loader"></div>
                    <p>Loading game...</p>
                </div>
                <iframe id="gameIframe" class="game-iframe" style="display:none;"></iframe>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <span class="settings-close" onclick="closeSettings()">&times;</span>
            <h2 style="margin-bottom: 20px;">⚙️ Settings</h2>
            
            <div class="settings-item">
                <label>Theme</label>
                <select id="theme">
                    <option value="dark">Dark (Default)</option>
                    <option value="light">Light</option>
                </select>
            </div>

            <div class="settings-item">
                <label>Search Engine</label>
                <select>
                    <option value="google">Google</option>
                    <option value="bing">Bing</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                </select>
            </div>

            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #3a3a4e;">
                <small style="color: #666;">DMCA • Terms of Service</small>
            </div>
        </div>
    </div>

    <script>
        // Games Data with working embedded games
        const games = [
            { 
                name: 'Flappy Bird', 
                emoji: '🐦',
                url: 'https://playcanvas.com/project/633024/view',
                thumbnail: '🐦'
            },
            { 
                name: 'Snake Game', 
                emoji: '🐍',
                url: 'https://playcanvas.com/project/414329/view',
                thumbnail: '🐍'
            },
            { 
                name: 'Pac-Man', 
                emoji: '👾',
                url: 'https://playcanvas.com/project/414329/view',
                thumbnail: '👾'
            },
            { 
                name: 'OvO', 
                emoji: '⭕',
                url: 'https://playcanvas.com/project/614208/view',
                thumbnail: '⭕'
            },
            { 
                name: 'Pong', 
                emoji: '🎾',
                url: 'https://playcanvas.com/project/483465/view',
                thumbnail: '🎾'
            },
            { 
                name: 'Memory Match', 
                emoji: '🧠',
                url: 'https://playcanvas.com/project/657249/view',
                thumbnail: '🧠'
            },
            { 
                name: 'Breakout', 
                emoji: '🧱',
                url: 'https://playcanvas.com/project/484704/view',
                thumbnail: '🧱'
            },
            { 
                name: 'Dino Runner', 
                emoji: '🦖',
                url: 'https://chromedino.com/',
                thumbnail: '🦖'
            },
            { 
                name: 'Tetris', 
                emoji: '🧩',
                url: 'https://playcanvas.com/project/567768/view',
                thumbnail: '🧩'
            },
            { 
                name: 'Chess', 
                emoji: '♟️',
                url: 'https://www.chess.com/play/online',
                thumbnail: '♟️'
            },
            { 
                name: 'Tic Tac Toe', 
                emoji: '⭕❌',
                url: 'https://playcanvas.com/project/621276/view',
                thumbnail: '⭕'
            },
            { 
                name: 'Simon Says', 
                emoji: '🎯',
                url: 'https://playcanvas.com/project/662537/view',
                thumbnail: '🎯'
            }
        ];

        // Apps Data
        const apps = [
            { name: 'Gmail', emoji: '📧', url: 'https://mail.google.com' },
            { name: 'Google Drive', emoji: '☁️', url: 'https://drive.google.com' },
            { name: 'Figma', emoji: '🎨', url: 'https://figma.com' },
            { name: 'Notion', emoji: '📝', url: 'https://notion.so' },
            { name: 'Canva', emoji: '🖌️', url: 'https://canva.com' },
            { name: 'GitHub', emoji: '💻', url: 'https://github.com' },
        ];

        // Shopping Data
        const shopping = [
            { name: 'Amazon', emoji: '📦', url: 'https://amazon.com' },
            { name: 'eBay', emoji: '🛒', url: 'https://ebay.com' },
            { name: 'Aliexpress', emoji: '🌏', url: 'https://aliexpress.com' },
        ];

        // AI Data
        const aiTools = [
            { name: 'ChatGPT', emoji: '🤖', url: 'https://chatgpt.com' },
            { name: 'Claude', emoji: '🧠', url: 'https://claude.ai' },
            { name: 'Gemini', emoji: '✨', url: 'https://gemini.google.com' },
            { name: 'Copilot', emoji: '🪶', url: 'https://copilot.microsoft.com' },
        ];

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadGames();
            loadApps();
            loadShopping();
            loadAI();
        });

        function loadGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = games.map((game, index) => `
                <div class="game-card" onclick="playGame(${index})">
                    <div class="game-card-image">
                        <div class="game-overlay">${game.emoji}</div>
                    </div>
                    <div class="game-card-title">${game.name}</div>
                </div>
            `).join('');
        }

        function loadApps() {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = apps.map(app => `
                <div class="app-card" onclick="quickAccess('${app.url}')">
                    <div class="app-icon">${app.emoji}</div>
                    <div class="app-name">${app.name}</div>
                </div>
            `).join('');
        }

        function loadShopping() {
            const grid = document.getElementById('shoppingGrid');
            grid.innerHTML = shopping.map(item => `
                <div class="app-card" onclick="quickAccess('${item.url}')">
                    <div class="app-icon">${item.emoji}</div>
                    <div class="app-name">${item.name}</div>
                </div>
            `).join('');
        }

        function loadAI() {
            const grid = document.getElementById('aiGrid');
            grid.innerHTML = aiTools.map(tool => `
                <div class="app-card" onclick="quickAccess('${tool.url}')">
                    <div class="app-icon">${tool.emoji}</div>
                    <div class="app-name">${tool.name}</div>
                </div>
            `).join('');
        }

        function playGame(index) {
            const game = games[index];
            document.getElementById('gameModalTitle').textContent = game.name;
            document.getElementById('gameIframe').src = game.url;
            document.getElementById('gameModal').classList.add('active');
            
            // Hide loading after a delay
            setTimeout(() => {
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('gameIframe').style.display = 'block';
            }, 2000);
        }

        function closeGameModal() {
            document.getElementById('gameModal').classList.remove('active');
            document.getElementById('gameIframe').src = '';
            document.getElementById('loadingMsg').style.display = 'block';
            document.getElementById('gameIframe').style.display = 'none';
        }

        function showSection(sectionId) {
            // Hide all
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar-icon').forEach(el => el.classList.remove('active'));

            // Show selected
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        function quickAccess(url) {
            window.open(url, '_blank');
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                searchUrl();
            }
        }

        function handleHomeSearch(event) {
            if (event.key === 'Enter') {
                let url = document.getElementById('homeSearch').value;
                if (!url.startsWith('http')) url = 'https://' + url;
                quickAccess(url);
            }
        }

        function searchUrl() {
            let url = document.getElementById('urlInput').value;
            if (!url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            quickAccess(url);
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('Fullscreen not available');
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Close modals when clicking outside
        window.onclick = function(event) {
            const gameModal = document.getElementById('gameModal');
            const settingsModal = document.getElementById('settingsModal');
            
            if (event.target == gameModal) {
                closeGameModal();
            }
            if (event.target == settingsModal) {
                closeSettings();
            }
        }

        // Close game modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeGameModal();
                closeSettings();
            }
        });
    </script>
</body>
</html>
